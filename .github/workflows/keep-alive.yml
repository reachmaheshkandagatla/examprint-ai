name: ExamPrint AI Uptime Monitor

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    timeout-minutes: 3

    steps:
      - name: Check ExamPrint AI
        env:
          APP_URL: https://examprint-ai.streamlit.app
        run: |
          HEALTH_URL="${APP_URL%/}/~/+/_stcore/health"

          echo "Checking: $HEALTH_URL"

          STATUS=$(curl -L -sS \
            --max-time 60 \
            -o /dev/null \
            -w "%{http_code}" \
            "$HEALTH_URL")

          echo "HTTP Status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "SUCCESS: ExamPrint AI is responding"
          else
            echo "FAILURE: ExamPrint AI returned HTTP $STATUS"
            exit 1
          fi
